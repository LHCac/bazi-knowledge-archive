name: Clean imported archive duplicates

on:
  push:
    branches:
      - agent/unpack-bazi-archive
    paths:
      - .github/workflows/cleanup-import-duplicates.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/unpack-bazi-archive
          fetch-depth: 0

      - name: Remove verified duplicate tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf liuyao-divination-archive-export-bazi-standalone

      - name: Write cleanup notes and refresh audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 00_index
          cat > 00_index/IMPORT_CLEANUP_NOTES.md <<'EOF'
          # 壓縮檔匯入整理紀錄

          ## 匯入來源

          - 原始檔：`bazi-standalone.zip`
          - 保存位置：`99_sources/imports/bazi-standalone.zip`
          - 整理分支：`agent/unpack-bazi-archive`

          ## 已完成處理

          1. 將壓縮檔內的正式八字資料夾展開至 repository 根目錄。
          2. 保留原始 ZIP，作為來源追溯與重新驗證依據。
          3. 移除 `liuyao-divination-archive-export-bazi-standalone/` 巢狀目錄。
          4. 該巢狀目錄內的 Markdown 檔案，經 SHA-256 檢查皆與根目錄版本完全相同，因此移除不影響內容。
          5. 語意相近但內容不完全相同的文件未自動合併，避免誤刪規則或來源差異。

          ## 後續建議

          - 補齊 `00_index/` 的十神、格局、行運、問事與案例子索引。
          - 對含有重斷語的十神宮位文件建立「降火修正版」。
          - 為來源文件補充書名、章節、頁碼或網址等可追溯資料。
          - 語意重疊文件應先比較差異，再由人工決定合併或保留。
          EOF

          {
            echo '# Repository 檔案清單'
            echo
            echo '由整理流程自動產生，供結構檢查與索引維護。'
            echo
            echo '```text'
            find . -type f \
              ! -path './.git/*' \
              ! -path './.github/workflows/*' \
              ! -path './00_index/REPOSITORY_FILE_MANIFEST.md' \
              -printf '%P\n' | LC_ALL=C sort
            echo '```'
          } > 00_index/REPOSITORY_FILE_MANIFEST.md

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          from collections import defaultdict

          root = Path('.')
          excluded = {
              Path('00_index/REPOSITORY_FILE_MANIFEST.md'),
              Path('00_index/DUPLICATE_CONTENT_REPORT.md'),
          }
          groups = defaultdict(list)
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in excluded or path.parts[:2] == ('.github', 'workflows'):
                  continue
              groups[hashlib.sha256(path.read_bytes()).hexdigest()].append(path.as_posix())

          duplicates = [(digest, paths) for digest, paths in groups.items() if len(paths) > 1]
          lines = [
              '# 重複內容檢查',
              '',
              f'- 掃描檔案數：{sum(len(v) for v in groups.values())}',
              f'- 完全相同內容群組：{len(duplicates)}',
              '',
          ]
          if duplicates:
              for digest, paths in sorted(duplicates, key=lambda item: item[1]):
                  lines.extend([f'## `{digest}`', ''])
                  lines.extend(f'- `{path}`' for path in paths)
                  lines.append('')
          else:
              lines.extend(['未發現 SHA-256 完全相同的檔案內容。', ''])
          Path('00_index/DUPLICATE_CONTENT_REPORT.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Clean imported Bazi archive structure'
          git push origin HEAD:agent/unpack-bazi-archive
