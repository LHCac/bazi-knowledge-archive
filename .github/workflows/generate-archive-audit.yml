name: Generate archive audit

on:
  push:
    branches:
      - agent/unpack-bazi-archive
    paths:
      - .github/workflows/generate-archive-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/unpack-bazi-archive
          fetch-depth: 0

      - name: Generate manifest and duplicate report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 00_index
          {
            echo '# Repository 檔案清單'
            echo
            echo '由整理流程自動產生，供結構檢查與索引維護。'
            echo
            echo '```text'
            find . -type f \
              ! -path './.git/*' \
              ! -path './.github/workflows/*' \
              ! -path './00_index/REPOSITORY_FILE_MANIFEST.md' \
              -printf '%P\n' | LC_ALL=C sort
            echo '```'
          } > 00_index/REPOSITORY_FILE_MANIFEST.md

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          from collections import defaultdict

          root = Path('.')
          groups = defaultdict(list)
          excluded = {
              Path('00_index/REPOSITORY_FILE_MANIFEST.md'),
              Path('00_index/DUPLICATE_CONTENT_REPORT.md'),
          }
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in excluded or path.parts[:2] == ('.github', 'workflows'):
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              groups[digest].append(path.as_posix())

          duplicates = [(digest, paths) for digest, paths in groups.items() if len(paths) > 1]
          lines = ['# 重複內容檢查', '', f'- 掃描檔案數：{sum(len(v) for v in groups.values())}', f'- 完全相同內容群組：{len(duplicates)}', '']
          if duplicates:
              for digest, paths in sorted(duplicates, key=lambda item: item[1]):
                  lines.extend([f'## `{digest}`', ''])
                  lines.extend(f'- `{path}`' for path in paths)
                  lines.append('')
          else:
              lines.append('未發現 SHA-256 完全相同的檔案內容。')
              lines.append('')
          Path('00_index/DUPLICATE_CONTENT_REPORT.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit audit files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00_index/REPOSITORY_FILE_MANIFEST.md 00_index/DUPLICATE_CONTENT_REPORT.md
          if git diff --cached --quiet; then
            echo 'No audit changes to commit.'
            exit 0
          fi
          git commit -m 'Add repository structure audit'
          git push origin HEAD:agent/unpack-bazi-archive
